name: Build and check emulator
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit source and build source-complete distribution
        run: |
          python public_audit.py --tracked
          python package.py
      - name: Test runtime, renderer, loader and local server
        run: |
          python check.py
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Render original audio fixtures in Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          python serve.py > /tmp/iapp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python -c "import urllib.request,time; time.sleep(1); urllib.request.urlopen('http://127.0.0.1:9052/__iapp/status').read()"
          npm run test:audio
      - uses: actions/upload-artifact@v7
        with:
          name: emulator-with-source
          path: dist/i-app-emulator-in-browser.zip
          if-no-files-found: error
