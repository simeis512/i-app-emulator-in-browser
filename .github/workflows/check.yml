name: Build and check emulator
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit source and build source-complete distribution
        run: |
          python public_audit.py --tracked
          python package.py
      - name: Test runtime, renderer, loader and local server
        run: |
          python check.py
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Render original audio fixtures in Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          python serve.py > /tmp/iapp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python -c "import urllib.request,time; time.sleep(1); urllib.request.urlopen('http://127.0.0.1:9052/__iapp/status').read()"
          npm run test:audio
      - uses: actions/upload-artifact@v7
        with:
          name: emulator-with-source
          path: dist/i-app-emulator-in-browser.zip
          if-no-files-found: error

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Check whether publishing is configured
        id: config
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"
          else echo 'ready=false' >> "$GITHUB_OUTPUT"; echo 'No Cloudflare credentials; skipping publication.'; fi
      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        if: steps.config.outputs.ready == 'true'
        with:
          name: emulator-with-source
      - name: Unpack the audited distribution
        if: steps.config.outputs.ready == 'true'
        run: unzip -q i-app-emulator-in-browser.zip -d publish
      - name: Publish the distribution's web directory
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy publish/web --project-name=i-appli --branch=main --commit-dirty=true
      - name: Verify the published site
        if: steps.config.outputs.ready == 'true'
        run: python publish/verify_site.py https://i-appli.simeis512.com --sums publish/SHA256SUMS.json --wait 180
